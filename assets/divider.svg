<svg width="900" height="8" viewBox="0 0 900 8" xmlns="http://www.w3.org/2000/svg">
  <style>
    .flow { animation: slide 4s linear infinite; }
    @keyframes slide { from { transform: translateX(-900px); } to { transform: translateX(0); } }
  </style>
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="flow">
    <rect x="0"   y="3" width="900" height="2" rx="1" fill="url(#dg)"/>
    <rect x="900" y="3" width="900" height="2" rx="1" fill="url(#dg)"/>
  </g>
</svg>

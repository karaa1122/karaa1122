<svg width="900" height="500" viewBox="0 0 900 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
    .rail {
      stroke: url(#railGrad); stroke-width: 3; stroke-linecap: round;
      stroke-dasharray: 400; stroke-dashoffset: 0;
      animation: draw 2.5s ease-out backwards;
    }
    .node {
      fill: #0b0a12; stroke-width: 2.5;
      animation: pulse 3s ease-in-out infinite;
      transform-box: fill-box; transform-origin: center;
    }
    .n1 { stroke: #a78bfa; }
    .n2 { stroke: #c4a5f7; animation-delay: .8s, 1s; }
    .n3 { stroke: #fbbf24; animation-delay: 1.6s, 2s; }
    .card {
      fill: #ffffff; fill-opacity: 0.03;
      stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1;
    }
    .g1 { animation: fadeUp .8s ease-out backwards; }
    .g2 { animation: fadeUp .8s ease-out .8s backwards; }
    .g3 { animation: fadeUp .8s ease-out 1.6s backwards; }
    .date { font-size: 13px; font-weight: 700; }
    .role { font-size: 18px; font-weight: 700; fill: #f2f0ff; }
    .org  { font-size: 12.5px; fill: #9a94b8; }
    .now  { font-size: 10px; font-weight: 700; fill: #0b0a12; }
    .nowpill { fill: #34d399; animation: pulse 3s ease-in-out infinite; }
    @keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes pulse { 50% { opacity: .55; } }
    @keyframes fadeUp { from { transform: translateY(14px); } to { transform: translateY(0); } }
  </style>

  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="16" fill="#0b0a12"/>

  <line class="rail" x1="70" y1="60" x2="70" y2="450"/>

  <!-- ═══ RIGT Company ═══ -->
  <circle class="node n1" cx="70" cy="100" r="9"/>
  <g class="g1">
    <rect class="card" x="110" y="54" width="740" height="112" rx="14"/>
    <text class="date" x="134" y="86" fill="#a78bfa">JUN 2023 — PRESENT</text>
    <rect class="nowpill" x="310" y="73" width="44" height="17" rx="8.5"/>
    <text class="now" x="320" y="85">NOW</text>
    <text class="role" x="134" y="112">Backend Engineer · RIGT Company</text>
    <text class="org"  x="134" y="134">Fintech infrastructure — card middleware, payment flows, ledger sync, digital goods</text>
    <text class="org"  x="134" y="152">Cardhouzz · Nasspay · Pay by Link</text>
  </g>

  <!-- ═══ Independent builds ═══ -->
  <circle class="node n2" cx="70" cy="255" r="9"/>
  <g class="g2">
    <rect class="card" x="110" y="209" width="740" height="112" rx="14"/>
    <text class="date" x="134" y="241" fill="#c4a5f7">2022 — 2023</text>
    <text class="role" x="134" y="267">Software Developer · Independent Projects</text>
    <text class="org"  x="134" y="289">Platforms, e-commerce, and industrial systems shipped end to end</text>
    <text class="org"  x="134" y="307">Eventy · Arbela · Site Power System · Meman Company</text>
  </g>

  <!-- ═══ University ═══ -->
  <circle class="node n3" cx="70" cy="410" r="9"/>
  <g class="g3">
    <rect class="card" x="110" y="364" width="740" height="112" rx="14"/>
    <text class="date" x="134" y="396" fill="#fbbf24">2018 — 2022</text>
    <text class="role" x="134" y="422">BSc Computer Science · Salahaddin University</text>
    <text class="org"  x="134" y="444">Erbil, Kurdistan — graduated 2022</text>
    <text class="org"  x="134" y="462">Foundations: algorithms, databases, systems programming</text>
  </g>
</svg>

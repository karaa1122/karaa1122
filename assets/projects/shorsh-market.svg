<svg width="440" height="250" viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
    .idx { font-size: 12px; font-weight: 700; fill: #2dd4bf; letter-spacing: 2px; }
    .cat { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; fill: #9a94b8; }
    .name { font-size: 24px; font-weight: 700; fill: #f2f0ff; }
    .desc { font-size: 11.5px; fill: #9a94b8; }
    .chiptxt { font-size: 10px; fill: #d8d4ee; }
    .rail { transform: scaleY(0); transform-origin: top;
            animation: rail 1s .2s cubic-bezier(.25,.46,.45,.94) forwards; }
    .fade { animation: up .7s ease backwards; }
    .f1 { animation-delay: .15s; } .f2 { animation-delay: .3s; }
    .f3 { animation-delay: .45s; } .f4 { animation-delay: .6s; }
    .tick { fill: #2dd4bf; animation: pulse 3s ease-in-out infinite; }
    @keyframes rail { to { transform: scaleY(1); } }
    @keyframes up { from { transform: translateY(10px); }
                    to { transform: translateY(0); } }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
  <rect width="440" height="250" rx="10" fill="#0d0c16"/>
  <rect x="0.5" y="0.5" width="439" height="249" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect class="rail" x="0" y="10" width="4" height="230" rx="2" fill="#2dd4bf"/>
  <text class="idx" x="416" y="34" text-anchor="end">/09</text>
  <circle class="tick" cx="370" cy="30" r="3"/>
  <text class="fade f1" x="30" y="52" font-size="26">🏪</text>
  <text class="cat fade f2" x="76" y="45">PLATFORM · QR PROFILES</text>
  <text class="name fade f2" x="30" y="106">Shorsh Market</text>
  <g class="fade f3"><text class="desc" x="30" y="146">QR-based digital business profiles — trilingual</text><text class="desc" x="30" y="164">(EN/AR/KU) with full RTL, JWT refresh-token rotation,</text><text class="desc" x="30" y="182">S3-ready storage, admin dashboard.</text></g>
  <g class="fade f4"><rect x="30" y="210" width="66" height="21" rx="4" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/><text class="chiptxt" x="63.0" y="225" text-anchor="middle">NestJS</text><rect x="104" y="210" width="74" height="21" rx="4" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/><text class="chiptxt" x="141.0" y="225" text-anchor="middle">Next.js</text><rect x="186" y="210" width="74" height="21" rx="4" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/><text class="chiptxt" x="223.0" y="225" text-anchor="middle">TypeORM</text><rect x="268" y="210" width="66" height="21" rx="4" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/><text class="chiptxt" x="301.0" y="225" text-anchor="middle">Docker</text></g>
</svg>

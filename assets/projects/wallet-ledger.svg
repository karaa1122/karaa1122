<svg width="440" height="250" viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
    .idx { font-size: 12px; font-weight: 700; fill: #6db33f; letter-spacing: 2px; }
    .cat { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; fill: #9a94b8; }
    .name { font-size: 24px; font-weight: 700; fill: #f2f0ff; }
    .desc { font-size: 11.5px; fill: #9a94b8; }
    .chiptxt { font-size: 10px; fill: #d8d4ee; }
    .rail { transform: scaleY(0); transform-origin: top;
            animation: rail 1s .2s cubic-bezier(.25,.46,.45,.94) forwards; }
    .fade { animation: up .7s ease backwards; }
    .f1 { animation-delay: .15s; } .f2 { animation-delay: .3s; }
    .f3 { animation-delay: .45s; } .f4 { animation-delay: .6s; }
    .tick { fill: #6db33f; animation: pulse 3s ease-in-out infinite; }
    @keyframes rail { to { transform: scaleY(1); } }
    @keyframes up { from { transform: translateY(10px); }
                    to { transform: translateY(0); } }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
  <rect width="440" height="250" rx="10" fill="#0d0c16"/>
  <rect x="0.5" y="0.5" width="439" height="249" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect class="rail" x="0" y="10" width="4" height="230" rx="2" fill="#6db33f"/>
  <text class="idx" x="416" y="34" text-anchor="end">/03</text>
  <circle class="tick" cx="370" cy="30" r="3"/>
  <text class="fade f1" x="30" y="52" font-size="26">📒</text>
  <text class="cat fade f2" x="76" y="45">FINTECH · MICROSERVICES · WIP</text>
  <text class="name fade f2" x="30" y="106">Wallet Ledger</text>
  <g class="fade f3"><text class="desc" x="30" y="146">Immutable double-entry ledger with a transfer saga over</text><text class="desc" x="30" y="164">Kafka (outbox pattern). Correctness under concurrency,</text><text class="desc" x="30" y="182">idempotency, auditability.</text></g>
  <g class="fade f4"><rect x="30" y="210" width="74" height="21" rx="4" fill="#6db33f" fill-opacity="0.08" stroke="#6db33f" stroke-opacity="0.4"/><text class="chiptxt" x="67.0" y="225" text-anchor="middle">Java 21</text><rect x="112" y="210" width="106" height="21" rx="4" fill="#6db33f" fill-opacity="0.08" stroke="#6db33f" stroke-opacity="0.4"/><text class="chiptxt" x="165.0" y="225" text-anchor="middle">Spring Boot</text><rect x="226" y="210" width="58" height="21" rx="4" fill="#6db33f" fill-opacity="0.08" stroke="#6db33f" stroke-opacity="0.4"/><text class="chiptxt" x="255.0" y="225" text-anchor="middle">Kafka</text><rect x="292" y="210" width="98" height="21" rx="4" fill="#6db33f" fill-opacity="0.08" stroke="#6db33f" stroke-opacity="0.4"/><text class="chiptxt" x="341.0" y="225" text-anchor="middle">PostgreSQL</text></g>
</svg>

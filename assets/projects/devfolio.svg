<svg width="440" height="250" viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
    .idx { font-size: 12px; font-weight: 700; fill: #38bdf8; letter-spacing: 2px; }
    .cat { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; fill: #9a94b8; }
    .name { font-size: 24px; font-weight: 700; fill: #f2f0ff; }
    .desc { font-size: 11.5px; fill: #9a94b8; }
    .chiptxt { font-size: 10px; fill: #d8d4ee; }
    .rail { transform: scaleY(0); transform-origin: top;
            animation: rail 1s .2s cubic-bezier(.25,.46,.45,.94) forwards; }
    .fade { animation: up .7s ease backwards; }
    .f1 { animation-delay: .15s; } .f2 { animation-delay: .3s; }
    .f3 { animation-delay: .45s; } .f4 { animation-delay: .6s; }
    .tick { fill: #38bdf8; animation: pulse 3s ease-in-out infinite; }
    @keyframes rail { to { transform: scaleY(1); } }
    @keyframes up { from { transform: translateY(10px); }
                    to { transform: translateY(0); } }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
  <rect width="440" height="250" rx="10" fill="#0d0c16"/>
  <rect x="0.5" y="0.5" width="439" height="249" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect class="rail" x="0" y="10" width="4" height="230" rx="2" fill="#38bdf8"/>
  <text class="idx" x="416" y="34" text-anchor="end">/05</text>
  <circle class="tick" cx="370" cy="30" r="3"/>
  <text class="fade f1" x="30" y="52" font-size="26">🗂️</text>
  <text class="cat fade f2" x="76" y="45">SAAS · DEV TOOLS</text>
  <text class="name fade f2" x="30" y="106">DevFolio</text>
  <g class="fade f3"><text class="desc" x="30" y="146">Visual portfolio builder — drag-and-drop sections, live</text><text class="desc" x="30" y="164">preview, GitHub auto-import. Whole portfolio in one</text><text class="desc" x="30" y="182">JSON, exports to static HTML.</text></g>
  <g class="fade f4"><rect x="30" y="210" width="74" height="21" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4"/><text class="chiptxt" x="67.0" y="225" text-anchor="middle">Next.js</text><rect x="112" y="210" width="66" height="21" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4"/><text class="chiptxt" x="145.0" y="225" text-anchor="middle">NestJS</text><rect x="186" y="210" width="98" height="21" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4"/><text class="chiptxt" x="235.0" y="225" text-anchor="middle">PostgreSQL</text><rect x="292" y="210" width="66" height="21" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4"/><text class="chiptxt" x="325.0" y="225" text-anchor="middle">BullMQ</text></g>
</svg>
